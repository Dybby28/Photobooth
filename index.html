<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYBIL'S 15TH • Casino Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --gold-light: #FFDF73;
      --crimson: #800000;
      --black: #0D0D0D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', serif;
    }

    body {
      background: radial-gradient(circle at center, #2b0202 0%, var(--black) 100%);
      color: var(--gold-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .booth-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 4 / 5;
      background: #000;
      border: 3px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(128, 0, 0, 0.7);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }

    .countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 6rem;
      color: var(--gold-light);
      text-shadow: 0 0 20px #000, 0 0 10px var(--crimson);
      background: rgba(0,0,0,0.3);
      pointer-events: none;
      display: none;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-top: 14px;
    }

    button {
      background: linear-gradient(135deg, var(--gold) 0%, #AA771C 100%);
      color: #000;
      border: 1px solid var(--gold-light);
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      background: #444;
      color: #888;
      border-color: #555;
      cursor: not-allowed;
    }

    .secondary {
      background: transparent;
      color: var(--gold-light);
      border-color: var(--gold);
    }

    .status {
      width: 100%;
      max-width: 380px;
      margin-top: 8px;
      text-align: center;
      font-size: .78rem;
      color: #ddd;
      min-height: 18px;
    }

    .preview-section {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
    }

    canvas {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      margin-bottom: 12px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .action-row button {
      flex: 1;
    }

    body {
      background:
        radial-gradient(circle at 50% 12%, rgba(126, 0, 20, .55), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(212, 175, 55, .12), transparent 28%),
        linear-gradient(145deg, #050505 0%, #160006 45%, #050505 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "♠   ♦   ♣   ♥   ♠   ♦   ♣   ♥";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .055;
      font-family: Georgia, serif;
      font-size: 42px;
      line-height: 1.8;
      word-spacing: 22px;
      transform: rotate(-12deg) scale(1.25);
      z-index: -1;
    }

    .eyebrow {
      margin-top: 2px;
      color: #d4af37;
      font-size: .68rem;
      letter-spacing: 2.8px;
      text-align: center;
      opacity: .9;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(2rem, 9vw, 3.1rem);
      letter-spacing: 4px;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 1.35em;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff0a0 0%, #d4af37 45%, #8b6114 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .subhead {
      margin: 7px 0 13px;
      color: #f4df91;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: .76rem;
      letter-spacing: 2.2px;
      text-align: center;
    }

    .booth-container {
      max-width: 410px;
      aspect-ratio: 4 / 5.25;
      border: 1px solid #f2d36b;
      border-radius: 18px;
      box-shadow:
        0 0 0 5px rgba(212,175,55,.08),
        0 0 0 9px rgba(128,0,0,.16),
        0 20px 55px rgba(0,0,0,.85),
        0 0 35px rgba(128,0,0,.4);
    }

    .booth-container::after {
      content: "♠";
      position: absolute;
      left: 13px;
      bottom: 7px;
      color: rgba(255,223,115,.75);
      font-size: 22px;
      text-shadow: 0 0 8px #000;
      pointer-events: none;
    }

    .controls {
      max-width: 410px;
    }

    button {
      background:
        linear-gradient(180deg, #f6d96b 0%, #d4af37 45%, #8d6419 100%);
      border: 1px solid #ffe98e;
      box-shadow: 0 5px 18px rgba(0,0,0,.65), inset 0 1px rgba(255,255,255,.45);
      text-transform: uppercase;
    }

    .secondary {
      background: rgba(0,0,0,.55);
      box-shadow: inset 0 0 0 1px rgba(212,175,55,.25);
    }

    .status {
      color: #e8d998;
      font-family: "Playfair Display", serif;
      font-style: italic;
    }

    .preview-section {
      max-width: 410px;
    }

    canvas {
      border: 1px solid rgba(212,175,55,.65);
      padding: 4px;
      background: #080808;
    }

  </style>
</head>
<body>

  <div class="eyebrow">♠ ♦ ♥ ♣ &nbsp; THE HOUSE OF &nbsp; ♣ ♥ ♦ ♠</div>
  <h1>SYBIL'S <span>15TH</span></h1>
  <div class="subhead">A NIGHT OF LUCK • GLAMOUR • MISCHIEF</div>

  <div class="booth-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="countdown" class="countdown-overlay">3</div>
  </div>

  <div class="status" id="status">Camera ready check…</div>
  <div class="controls">
    <button id="startBtn">♠ DEAL MY PHOTOS</button>
    <button id="fullscreenBtn" class="secondary">⛶ FULL SCREEN</button>
  </div>

  <div class="preview-section" id="previewSection">
    <canvas id="outputCanvas" width="600" height="1500"></canvas>
    <div class="action-row">
      <button id="saveBtn">💾 KEEP MY LUCKY STRIP</button>
      <button id="shareBtn">✨ SHARE THE LUCK</button>
    </div>
    <button id="retakeBtn" style="margin-top: 8px; background: transparent; color: var(--gold); border: 1px solid var(--gold);">↻ PLAY AGAIN</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const countdownEl = document.getElementById('countdown');
    const startBtn = document.getElementById('startBtn');
    const previewSection = document.getElementById('previewSection');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const saveBtn = document.getElementById('saveBtn');
    const shareBtn = document.getElementById('shareBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const statusEl = document.getElementById('status');

    let capturedFrames = [];

    // Initialize Camera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        statusEl.textContent = '● Camera ready — strike a pose!';
      } catch (err) {
        statusEl.textContent = 'Camera unavailable — allow camera access and reload.';
        alert('Camera access denied or unavailable. Please enable camera permissions.');
      }
    }
    initCamera();


    // Helpful diagnostic for local HTML files
    if (location.protocol === 'file:') {
      statusEl.textContent = 'Ready. If Chrome blocks the camera from this file, open it through localhost/HTTPS.';
    }

    // Photobooth Sequence
    startBtn.addEventListener('click', async () => {
      if (!cameraReady) {
        const ready = await initCamera();
        if (!ready) return;
      }

      startBtn.disabled = true;
      capturedFrames = [];
      previewSection.style.display = 'none';
      statusEl.textContent = 'Get ready… 3 photos coming up!';

      try {
        for (let i = 1; i <= 3; i++) {
          await runCountdown(3);
          capturePhoto();
          statusEl.textContent = `Photo ${i} of 3 captured!`;
          await new Promise(r => setTimeout(r, 600));
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'The camera frame was not ready. Please try again.';
        startBtn.disabled = false;
        return;
      }

      renderCasinoStrip();
      previewSection.style.display = 'flex';
      startBtn.disabled = false;
      statusEl.textContent = '✨ Your casino strip is ready!';
      previewSection.scrollIntoView({ behavior: 'smooth' });
    });

    function runCountdown(seconds) {
      return new Promise(resolve => {
        countdownEl.style.display = 'flex';
        let current = seconds;
        countdownEl.textContent = current;

        const interval = setInterval(() => {
          current--;
          if (current > 0) {
            countdownEl.textContent = current;
          } else {
            clearInterval(interval);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    function capturePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        throw new Error('Camera frame is not ready yet.');
      }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 500;
      tempCanvas.height = 375;
      const tCtx = tempCanvas.getContext('2d');

      // Mirror capture to match preview
      tCtx.translate(tempCanvas.width, 0);
      tCtx.scale(-1, 1);

      // Crop video to 4:3 without stretching
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const targetRatio = 4 / 3;
      const sourceRatio = vWidth / vHeight;
      let cropW, cropH, cropX, cropY;

      if (sourceRatio > targetRatio) {
        cropH = vHeight;
        cropW = vHeight * targetRatio;
        cropX = (vWidth - cropW) / 2;
        cropY = 0;
      } else {
        cropW = vWidth;
        cropH = vWidth / targetRatio;
        cropX = 0;
        cropY = (vHeight - cropH) / 2;
      }

      tCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 500, 375);

      capturedFrames.push(tempCanvas);
    }

    function renderCasinoStrip() {
      const W = 600, H = 1500;
      ctx.clearRect(0, 0, W, H);

      // Rich velvet background
      const bg = ctx.createRadialGradient(300, 550, 80, 300, 750, 900);
      bg.addColorStop(0, '#4b000e');
      bg.addColorStop(.48, '#180006');
      bg.addColorStop(1, '#030303');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Fine gold frame + inner red frame
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 7;
      ctx.strokeRect(14, 14, W - 28, H - 28);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#7e5b19';
      ctx.strokeRect(25, 25, W - 50, H - 50);

      // Top title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f9e8a2';
      ctx.font = '16px Georgia, serif';
      ctx.fillText('♠  ♦  ♥  ♣  •  CASINO NIGHT  •  ♣  ♥  ♦  ♠', 300, 56);

      ctx.fillStyle = '#fff0a0';
      ctx.font = 'bold 48px "Cinzel", serif';
      ctx.shadowColor = 'rgba(212,175,55,.6)';
      ctx.shadowBlur = 14;
      ctx.fillText("SYBIL'S", 300, 104);
      ctx.font = 'italic bold 58px "Playfair Display", serif';
      ctx.fillText('15TH', 300, 157);
      ctx.shadowBlur = 0;

      // Decorative divider
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(65, 178); ctx.lineTo(535, 178); ctx.stroke();
      ctx.fillStyle = '#D4AF37';
      ctx.font = '22px Georgia, serif';
      ctx.fillText('♦', 300, 186);

      // Three photo cards
      const photoWidth = 500;
      const photoHeight = 300;
      const startX = 50;
      const startY = 210;
      const spacing = 335;

      capturedFrames.forEach((frame, idx) => {
        const y = startY + idx * spacing;

        // Card shadow
        ctx.fillStyle = 'rgba(0,0,0,.65)';
        ctx.fillRect(startX - 10, y - 10, photoWidth + 20, photoHeight + 20);

        // Gold border
        ctx.strokeStyle = '#D4AF37';
        ctx.lineWidth = 4;
        ctx.strokeRect(startX - 5, y - 5, photoWidth + 10, photoHeight + 10);

        ctx.drawImage(frame, startX, y, photoWidth, photoHeight);

        // Corner suit
        ctx.fillStyle = idx === 1 ? '#f3d96b' : '#ffffff';
        ctx.font = '22px Georgia, serif';
        ctx.textAlign = 'left';
        ctx.fillText(idx === 0 ? '♠' : idx === 1 ? '♦' : '♣', startX + 8, y + 27);
        ctx.textAlign = 'right';
        ctx.fillText('♥', startX + photoWidth - 8, y + photoHeight - 8);
      });

      // Bottom "keepsake" panel
      const panelY = 1240;
      ctx.fillStyle = 'rgba(0,0,0,.48)';
      ctx.fillRect(42, panelY, 516, 195);
      ctx.strokeStyle = '#8d6b24';
      ctx.lineWidth = 1;
      ctx.strokeRect(42, panelY, 516, 195);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#d4af37';
      ctx.font = '18px Georgia, serif';
      ctx.fillText("♦  TONIGHT'S LUCKY MEMORY  ♦", 300, panelY + 34);

      ctx.fillStyle = '#fff0a0';
      ctx.font = 'bold 34px "Cinzel", serif';
      ctx.fillText("SYBIL'S 15TH", 300, panelY + 82);

      ctx.fillStyle = '#f1df9c';
      ctx.font = 'italic 18px "Playfair Display", serif';
      ctx.fillText('One night. One lucky hand. One unforgettable memory.', 300, panelY + 119);

      ctx.fillStyle = '#b9943c';
      ctx.font = '14px Georgia, serif';
      ctx.fillText('♠  ♥  ♦  ♣', 300, panelY + 158);

      // Tiny serial-style footer
      ctx.fillStyle = '#80601f';
      ctx.font = '10px Arial, sans-serif';
      ctx.fillText('CASINO NIGHT • 15 • LUCKY MEMORIES', 300, 1470);
    }

    // Save Image
    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `sybils-15th-photobooth-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Native Mobile Share (Direct to Instagram Stories / Feed / WhatsApp)
    shareBtn.addEventListener('click', async () => {
      canvas.toBlob(async blob => {
        const file = new File([blob], 'sybil-15th-photostrip.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: "Sybil's 15th Birthday",
              text: "Had a blast at Sybil's Casino Night! 🎰✨"
            });
          } catch (err) {
            console.log('Share dismissed');
          }
        } else {
          // Fallback if Web Share API is unsupported
          const link = document.createElement('a');
          link.download = `sybils-15th-${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          alert('Photo strip downloaded! You can now upload it directly to Instagram Stories.');
        }
      }, 'image/png');
    });

    retakeBtn.addEventListener('click', () => {
      previewSection.style.display = 'none';
      capturedFrames = [];
      statusEl.textContent = 'Ready for another round!';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = '✕ EXIT FULL SCREEN';
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = '⛶ FULL SCREEN';
        }
      } catch (err) {
        statusEl.textContent = 'Full screen is not available on this device.';
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent =
        document.fullscreenElement ? '✕ EXIT FULL SCREEN' : '⛶ FULL SCREEN';
    });
  </script>
</body>
</html>
