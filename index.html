<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sybil's 15th Birthday Bash • Casino Photobooth</title>
<style>
:root{--gold:#d7ad32;--gold2:#ffe38a;--red:#8d0718;--red2:#c51b2e;--black:#050505}
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;min-height:100%;font-family:Georgia,serif}
body{display:flex;justify-content:center}
.app{width:min(100%,760px);padding:16px 12px 30px;text-align:center}
.top{color:var(--gold2);font-size:12px;letter-spacing:3px;margin-bottom:8px}
h1{margin:0;font-size:clamp(34px,8vw,58px);letter-spacing:3px;color:#ffe9a2}
h1 small{display:block;font-size:.5em;letter-spacing:5px;margin-top:6px}
.tag{margin:9px 0 15px;color:#cdbb82;font-size:12px;letter-spacing:2px}
.camera{position:relative;width:min(100%,620px);aspect-ratio:4/5;margin:auto;background:#000;border:2px solid var(--gold);border-radius:15px;overflow:hidden;box-shadow:0 0 0 5px rgba(215,173,50,.08),0 20px 50px #000}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.frame{position:absolute;inset:9px;border:1px solid #ffe38a;pointer-events:none}
.corner{position:absolute;color:#ffe38a;font-size:28px;text-shadow:0 2px 5px #000}
.tl{top:14px;left:14px}.tr{top:14px;right:14px}.bl{bottom:14px;left:14px}.br{bottom:14px;right:14px}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0005;z-index:5}
.num{width:145px;height:145px;border-radius:50%;border:4px solid #ffe38a;background:#4d0010e8;display:flex;align-items:center;justify-content:center;font:bold 86px Georgia;box-shadow:0 0 30px #d7ad3270}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
.flash.on{animation:fl .28s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.status{min-height:22px;margin:10px;color:#e9d99d;font-size:14px}
.progress{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.dot{width:9px;height:9px;border:1px solid var(--gold);border-radius:50%}
.dot.done,.dot.active{background:var(--gold2);box-shadow:0 0 10px #d7ad32}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
button{border:1px solid var(--gold2);border-radius:999px;padding:14px 22px;font:bold 14px Georgia;letter-spacing:1px;cursor:pointer;background:linear-gradient(#ffe58a,#d4af37,#966815);color:#090909;box-shadow:0 6px 16px #0008}
button.secondary{background:#100909;color:#ffe38a;border-color:var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.result{display:none;width:min(100%,620px);margin:24px auto 0}
.result.show{display:block}
.result h2{font-size:18px;color:#ffe38a;letter-spacing:2px}
.stripbox{background:#050505;border:1px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 12px 35px #0009}
canvas{display:block;width:100%;height:auto}
.note{color:#bcae83;font-size:12px;line-height:1.4;margin:9px}
</style>
</head>
<body>
<main class="app">
  <div class="top">♠ ♦ ♥ ♣ &nbsp; CASINO NIGHT &nbsp; ♣ ♥ ♦ ♠</div>
  <h1>SYBIL'S <small>15TH BIRTHDAY BASH</small></h1>
  <div class="tag">TAKE YOUR SHOT • MAKE YOUR LUCKY MEMORY</div>

  <section class="camera" aria-label="Photobooth camera">
    <video id="video" autoplay playsinline muted></video>
    <div class="frame"></div>
    <span class="corner tl">♠</span><span class="corner tr">♦</span>
    <span class="corner bl">♣</span><span class="corner br">♥</span>
    <div class="count" id="count"><div class="num" id="num">3</div></div>
    <div class="flash" id="flash"></div>
  </section>

  <div class="status" id="status">Tap START to begin.</div>
  <div class="progress">
    <span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span>
  </div>
  <div class="controls">
    <button id="start">♠ START • 3 PHOTOS</button>
    <button id="again" class="secondary hidden">↻ RETAKE</button>
  </div>

  <section class="result" id="result">
    <h2>YOUR LUCKY STRIP</h2>
    <div class="stripbox"><canvas id="canvas" width="900" height="2500"></canvas></div>
    <div class="controls" style="margin-top:12px">
      <button id="save">💾 SAVE TO PHONE / COMPUTER</button>
      <button id="share" class="secondary">✨ SHARE</button>
    </div>
    <div class="note">On a phone, Share opens the system share sheet when supported. Choose Save Image / Save to Photos. On a computer, Save downloads the PNG.</div>
  </section>
</main>

<script>
(() => {
"use strict";
const video=document.getElementById("video"),start=document.getElementById("start"),again=document.getElementById("again");
const status=document.getElementById("status"),count=document.getElementById("count"),num=document.getElementById("num");
const flash=document.getElementById("flash"),result=document.getElementById("result"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const dots=[document.getElementById("d1"),document.getElementById("d2"),document.getElementById("d3")];
let stream=null,photos=[],busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function progress(n){dots.forEach((d,i)=>{d.className="dot"+(i<n?" done":i===n?" active":"")})}

async function camera(){
 if(stream)return true;
 if(!navigator.mediaDevices?.getUserMedia){status.textContent="Camera is not available in this browser.";return false}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:1280}},audio:false});
  video.srcObject=stream;
  await new Promise(r=>video.readyState>=2?r():video.addEventListener("loadeddata",r,{once:true}));
  await video.play(); status.textContent="Camera ready — get everyone in frame!"; return true;
 }catch(e){console.error(e);status.textContent="Please allow camera access and press START again.";return false}
}

async function countdown(i){
 count.style.display="flex";
 for(let n=3;n>=1;n--){num.textContent=n;status.textContent=`Photo ${i} of 3 — ${n}…`;await sleep(1000)}
 count.style.display="none";
}

function capture(){
 const w=video.videoWidth,h=video.videoHeight;if(!w||!h)throw Error("camera not ready");
 const target=4/3,ratio=w/h;let sx=0,sy=0,sw=w,sh=h;
 if(ratio>target){sw=h*target;sx=(w-sw)/2}else{sh=w/target;sy=(h-sh)/2}
 const c=document.createElement("canvas");c.width=900;c.height=675;const x=c.getContext("2d");
 x.save();x.translate(900,0);x.scale(-1,1);x.drawImage(video,sx,sy,sw,sh,0,0,900,675);x.restore();
 flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on");return c;
}

function drawStrip(){
 const W=900,H=2500;
 ctx.clearRect(0,0,W,H);

 // Luxury casino velvet background
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#030303");
 bg.addColorStop(.38,"#190006");
 bg.addColorStop(.72,"#080204");
 bg.addColorStop(1,"#020202");
 ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

 const glow=ctx.createRadialGradient(450,1250,30,450,1250,850);
 glow.addColorStop(0,"rgba(145,0,22,.30)");
 glow.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

 // Grand layered casino frame
 ctx.strokeStyle="#e1b93f"; ctx.lineWidth=13;
 ctx.strokeRect(20,20,W-40,H-40);
 ctx.strokeStyle="#5d3b08"; ctx.lineWidth=6;
 ctx.strokeRect(37,37,W-74,H-74);
 ctx.strokeStyle="#b10c25"; ctx.lineWidth=3;
 ctx.strokeRect(49,49,W-98,H-98);
 ctx.strokeStyle="#f3d26a"; ctx.lineWidth=1.5;
 ctx.strokeRect(59,59,W-118,H-118);

 // Ornate corner flourishes
 [[66,66,1,1],[W-66,66,-1,1],[66,H-66,1,-1],[W-66,H-66,-1,-1]].forEach(([x,y,sx,sy])=>{
   ctx.save(); ctx.translate(x,y); ctx.scale(sx,sy);
   ctx.strokeStyle="#d7ad32"; ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(0,55,55,55);ctx.stroke();
   ctx.beginPath();ctx.moveTo(9,3);ctx.quadraticCurveTo(10,38,43,42);ctx.stroke();
   ctx.fillStyle="#d7ad32";ctx.beginPath();ctx.arc(2,2,5,0,Math.PI*2);ctx.fill();
   ctx.restore();
 });

 ctx.textAlign="center";
 ctx.fillStyle="#ffe7a0"; ctx.font="23px Georgia";
 ctx.fillText("♠   ♦   ♥   ♣     CASINO NIGHT     ♣   ♥   ♦   ♠",450,104);

 // Decorative casino line only — no duplicate birthday text at the top
 ctx.fillStyle="#d7ad32"; ctx.font="31px Georgia";
 ctx.fillText("♠        ♦        ♥        ♣        ♠",450,155);
 ctx.strokeStyle="#d7ad32";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(115,180);ctx.lineTo(785,180);ctx.stroke();
 ctx.fillStyle="#b10c25";ctx.beginPath();ctx.arc(450,180,7,0,Math.PI*2);ctx.fill();

 // Three photo windows
 const x=72,w=756,h=567,gap=28,top=205;
 photos.forEach((p,i)=>{
   const y=top+i*(h+gap);
   ctx.fillStyle="rgba(0,0,0,.9)";
   ctx.fillRect(x-15,y-15,w+30,h+30);

   ctx.strokeStyle="#d7ad32";ctx.lineWidth=7;
   ctx.strokeRect(x-8,y-8,w+16,h+16);
   ctx.strokeStyle="#a70d24";ctx.lineWidth=4;
   ctx.strokeRect(x-2,y-2,w+4,h+4);
   ctx.strokeStyle="#f0cf66";ctx.lineWidth=1.5;
   ctx.strokeRect(x+5,y+5,w-10,h-10);

   ctx.drawImage(p,x,y,w,h);

   ctx.fillStyle="#ffe38a";ctx.font="25px Georgia";
   ctx.textAlign="left";ctx.fillText(i===0?"♠":i===1?"♦":"♣",x+12,y+32);
   ctx.textAlign="right";ctx.fillText("♥",x+w-12,y+h-13);
 });

 // Grand title block immediately beneath photo 3.
 const thirdBottom=top+2*(h+gap)+h;
 const titleTop=thirdBottom+24;

 // Elegant gold marquee band
 ctx.fillStyle="rgba(18,2,7,.92)";
 ctx.fillRect(60,titleTop,780,455);
 ctx.strokeStyle="#d7ad32";ctx.lineWidth=5;
 ctx.strokeRect(60,titleTop,780,455);
 ctx.strokeStyle="#a70d24";ctx.lineWidth=3;
 ctx.strokeRect(74,titleTop+14,752,427);
 ctx.strokeStyle="#f3d26a";ctx.lineWidth=1;
 ctx.strokeRect(86,titleTop+26,728,403);

 // Decorative top and side suits
 ctx.fillStyle="#d7ad32";ctx.font="30px Georgia";ctx.textAlign="center";
 ctx.fillText("♠   ♦   ♣   ♥   ♠   ♦   ♣   ♥",450,titleTop+55);

 // BIG, elegant birthday typography
 ctx.shadowColor="rgba(255,210,70,.38)";ctx.shadowBlur=20;
 ctx.fillStyle="#fff0ad";
 ctx.font="bold 104px Georgia";
 ctx.fillText("SYBIL'S",450,titleTop+175);

 ctx.fillStyle="#d9a72e";
 ctx.font="italic bold 128px Georgia";
 ctx.fillText("15TH",450,titleTop+315);
 ctx.shadowBlur=0;

 // Marquee divider
 ctx.strokeStyle="#a70d24";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(150,titleTop+345);ctx.lineTo(750,titleTop+345);ctx.stroke();

 // Elegant subtitle
 ctx.fillStyle="#ffe39a";
 ctx.font="italic 56px Georgia";
 ctx.fillText("Birthday Bash",450,titleTop+410);

 // Small casino diamonds at the sides
 ctx.fillStyle="#d7ad32";ctx.font="44px Georgia";
 ctx.textAlign="left";ctx.fillText("♠",92,titleTop+180);
 ctx.textAlign="right";ctx.fillText("♥",808,titleTop+180);
 ctx.textAlign="left";ctx.fillText("♣",92,titleTop+385);
 ctx.textAlign="right";ctx.fillText("♦",808,titleTop+385);

 // No separate footer / no dead space.
}

async function take(){
 if(busy)return;busy=true;start.disabled=true;again.classList.add("hidden");result.classList.remove("show");photos=[];progress(0);
 if(!await camera()){start.disabled=false;busy=false;return}
 await sleep(500);
 try{
  for(let i=0;i<3;i++){progress(i);await countdown(i+1);photos.push(capture());progress(i+1);await sleep(650)}
  drawStrip();result.classList.add("show");again.classList.remove("hidden");status.textContent="✨ Done! Your Birthday Bash strip is ready.";result.scrollIntoView({behavior:"smooth"});
 }catch(e){console.error(e);status.textContent="The camera wasn't ready. Please try again."}
 start.disabled=false;busy=false;
}

function save(){
 const a=document.createElement("a");a.download="sybils-15th-birthday-bash.png";a.href=canvas.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
 status.textContent="💾 Photo strip downloaded.";
}
async function share(){
 canvas.toBlob(async blob=>{
  const file=new File([blob],"sybils-15th-birthday-bash.png",{type:"image/png"});
  try{
   if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:"Sybil's 15th Birthday Bash",text:"Sybil's 15th Birthday Bash 🎰"});status.textContent="✨ Shared!"}
   else save();
  }catch(e){if(e.name!=="AbortError")save()}
 },"image/png");
}
start.addEventListener("click",take);again.addEventListener("click",()=>{result.classList.remove("show");photos=[];progress(0);status.textContent="Ready for another round!";scrollTo({top:0,behavior:"smooth"})});
document.getElementById("save").addEventListener("click",save);document.getElementById("share").addEventListener("click",share);
})();
</script>
</body>
</html>
